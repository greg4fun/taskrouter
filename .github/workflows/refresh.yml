name: refresh-snapshot
# Pull the leaderboards once a day and commit data/snapshot.json when it changed.
on:
  schedule: [{ cron: '17 5 * * *' }]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: node src/cli/main.ts refresh --out data/snapshot.json
      - run: npm test
      - name: commit if changed
        run: |
          git config user.name "taskrouter-bot"
          git config user.email "taskrouter-bot@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +%F)" && git push
